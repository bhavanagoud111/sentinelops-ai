# SentinelOps local stack: control plane + observability + (until Phase 4) demo workload.
# All host ports bind to 127.0.0.1 only. Run via `make up` from the repo root.
name: sentinelops

x-python-service: &python-service
  build:
    context: ../..
    dockerfile: infra/docker/python-service.Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [sentinelops]

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  # Emit stable HTTP semantic conventions (http.server.request.duration, seconds).
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  DEPLOYMENT_ENVIRONMENT: local
  LOG_LEVEL: INFO
  FAULT_ADMIN_TOKEN: ${FAULT_ADMIN_TOKEN:-local-dev-fault-token}

x-platform-env: &platform-env
  DATABASE_URL: postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/sentinelops
  KAFKA_BOOTSTRAP: redpanda:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  DEPLOYMENT_ENVIRONMENT: local
  LOG_LEVEL: INFO

x-platform-service: &platform-service
  <<: *python-service
  image: sentinelops/platform:dev
  build:
    context: ../..
    dockerfile: infra/docker/python-service.Dockerfile
    args: { PACKAGE: sentinel-platform }
  environment:
    <<: *platform-env

services:
  # ------------------------------------------------------------- demo workload
  inventory:
    <<: *python-service
    image: sentinelops/demo-inventory:dev
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: { PACKAGE: demo-inventory }
    command: ["uvicorn", "--factory", "demo_inventory.app:build", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: inventory
    ports: ["127.0.0.1:${INVENTORY_PORT:-18082}:8000"]
    healthcheck: &py-health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      otel-collector: { condition: service_started }

  checkout:
    <<: *python-service
    image: sentinelops/demo-checkout:dev
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: { PACKAGE: demo-checkout }
    command: ["uvicorn", "--factory", "demo_checkout.app:build", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: checkout
      INVENTORY_URL: http://inventory:8000
      PAYMENT_PROVIDER_URL: http://payments.internal/v1
    ports: ["127.0.0.1:${CHECKOUT_PORT:-18081}:8000"]
    healthcheck: *py-health
    depends_on:
      inventory: { condition: service_healthy }

  loadgen:
    <<: *python-service
    image: sentinelops/demo-loadgen:dev
    build:
      context: ../..
      dockerfile: infra/docker/python-service.Dockerfile
      args: { PACKAGE: demo-loadgen }
    command: ["demo-loadgen"]
    environment:
      CHECKOUT_URL: http://checkout:8000
      INVENTORY_URL: http://inventory:8000
      LOADGEN_RPS: ${LOADGEN_RPS:-8}
    depends_on:
      checkout: { condition: service_healthy }

  # ------------------------------------------------------------- control plane
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: sentinelops
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelops"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [sentinelops]

  redpanda:
    image: redpandadata/redpanda:v26.1.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT:-19092}
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [sentinelops]

  migrate:
    <<: *platform-service
    command: ["python", "-m", "sentinel_storage.migrate", "upgrade"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  ingestion:
    <<: *platform-service
    command: ["uvicorn", "--factory", "sentinel_ingestion.app:build", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      <<: *platform-env
      OTEL_SERVICE_NAME: sentinel-ingestion
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
    secrets: [ingest_token]
    ports: ["127.0.0.1:${INGESTION_PORT:-18001}:8000"]
    healthcheck: *py-health
    depends_on:
      migrate: { condition: service_completed_successfully }

  relay:
    <<: *platform-service
    command: ["sentinel-relay"]
    environment:
      <<: *platform-env
      OTEL_SERVICE_NAME: sentinel-relay
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  correlator:
    <<: *platform-service
    command: ["sentinel-correlator"]
    environment:
      <<: *platform-env
      OTEL_SERVICE_NAME: sentinel-correlator
      REOPEN_WINDOW_MINUTES: "30"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  investigator:
    <<: *platform-service
    command: ["sentinel-investigator"]
    environment:
      <<: *platform-env
      OTEL_SERVICE_NAME: sentinel-investigator
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      # rules (default, deterministic, free) | claude (needs ANTHROPIC_API_KEY)
      SENTINEL_LLM_PROVIDER: ${SENTINEL_LLM_PROVIDER:-rules}
      SENTINEL_LLM_MODEL: ${SENTINEL_LLM_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTO_INVESTIGATE: "true"
      INVESTIGATION_DEADLINE_S: "120"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  api:
    <<: *platform-service
    command: ["uvicorn", "--factory", "sentinel_api.app:build", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      <<: *platform-env
      OTEL_SERVICE_NAME: sentinel-api
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-true}
      CORS_ORIGINS: http://127.0.0.1:${DASHBOARD_PORT:-13001},http://localhost:${DASHBOARD_PORT:-13001}
    secrets: [jwt_secret]
    ports: ["127.0.0.1:${API_PORT:-18000}:8000"]
    healthcheck: *py-health
    depends_on:
      migrate: { condition: service_completed_successfully }

  # ------------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-14318}:4318"
    restart: unless-stopped
    networks: [sentinelops]
    depends_on: [tempo, loki]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"]
    restart: unless-stopped
    networks: [sentinelops]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets: [ingest_token]
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-19093}:9093"]
    restart: unless-stopped
    networks: [sentinelops]

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../observability/loki/config.yaml:/etc/loki/config.yaml:ro
    ports: ["127.0.0.1:${LOKI_PORT:-13100}:3100"]
    restart: unless-stopped
    networks: [sentinelops]

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
    ports: ["127.0.0.1:${TEMPO_PORT:-13200}:3200"]
    restart: unless-stopped
    networks: [sentinelops]

  grafana:
    image: grafana/grafana:12.4.12
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-13000}:3000"]
    restart: unless-stopped
    networks: [sentinelops]
    depends_on: [prometheus, loki, tempo]

networks:
  sentinelops:
    name: sentinelops

volumes:
  prometheus-data:
  postgres-data:
  redpanda-data:

# Generated per machine by `make secrets` (random, git-ignored).
secrets:
  ingest_token:
    file: ../../.cache/secrets/ingest_token
  jwt_secret:
    file: ../../.cache/secrets/jwt_secret
