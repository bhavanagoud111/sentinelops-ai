# Serves the SPA and proxies /api to the SentinelOps API (same origin: no CORS).
server {
  listen 8080;
  server_tokens off;
  # Re-resolve the API through Docker DNS so container restarts (new IPs) don't break proxying.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  location /api/v1/events/stream {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /api/ {
    proxy_pass $api;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 1m;
  }
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri /index.html;
  }
}
