apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: sentinelops-demo
  labels: { app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: sentinelops-demo }
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app.kubernetes.io/name: loadgen } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loadgen, app.kubernetes.io/part-of: sentinelops-demo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loadgen
          image: sentinelops/demo-loadgen:dev
          imagePullPolicy: Never
          command: ["demo-loadgen"]
          env:
            - { name: OTEL_SERVICE_NAME, value: "loadgen" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "5000" }
