# Demo workload (sandbox). Applied by `make kind-up`; images loaded with `kind load`.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: sentinelops-demo
  labels: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: sentinelops-demo }
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app.kubernetes.io/name: checkout } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: sentinelops-demo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: checkout
          image: sentinelops/demo-checkout:dev
          imagePullPolicy: Never
          command: ["uvicorn", "--factory", "demo_checkout.app:build", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: "checkout" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "5000" }
            - { name: OTEL_SEMCONV_STABILITY_OPT_IN, value: "http" }
            - { name: DEPLOYMENT_ENVIRONMENT, value: "local" }
            - name: FAULT_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: demo-fault-token, key: token } }
            - { name: INVENTORY_URL, value: "http://inventory:8000" }
            - { name: PAYMENT_PROVIDER_URL, value: "http://payment:8000/v1" }
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 5, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: checkout, namespace: sentinelops-demo }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: checkout }
  ports: [{ name: http, port: 8000, targetPort: 8000, nodePort: 30081 }]
---
