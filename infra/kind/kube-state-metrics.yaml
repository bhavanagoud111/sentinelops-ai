# kube-state-metrics scoped to the demo namespace only (Role, not ClusterRole).
apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics, namespace: sentinelops-demo }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: kube-state-metrics, namespace: sentinelops-demo }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: kube-state-metrics, namespace: sentinelops-demo }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: kube-state-metrics }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: sentinelops-demo }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: sentinelops-demo
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kube-state-metrics } }
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --namespaces=sentinelops-demo
            - --resources=pods,deployments,replicasets
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /readyz, port: 8081 } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics, namespace: sentinelops-demo }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: http, port: 8080, targetPort: 8080, nodePort: 30080 }]
