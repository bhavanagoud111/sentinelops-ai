# Alerts are grouped by alertname+service and delivered to the SentinelOps
# ingestion gateway. Redeliveries (repeat_interval) are deduplicated by event_id.
route:
  receiver: sentinelops-gateway
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: sentinelops-gateway
    webhook_configs:
      - url: http://ingestion:8000/api/v1/ingest/alertmanager
        send_resolved: true
        max_alerts: 100
        timeout: 10s
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/ingest_token

inhibit_rules:
  # If the telemetry pipeline itself is down, service alerts are unreliable.
  - source_matchers: [alertname="TelemetryPipelineDown"]
    target_matchers: [severity=~"critical|high", alertname!="TelemetryPipelineDown"]
    equal: []
