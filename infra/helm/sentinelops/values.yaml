# SentinelOps control plane. Postgres, Kafka (Redpanda/MSK) and the observability
# backends are external dependencies addressed by URL; this chart does not run them.

image:
  platform:
    repository: sentinelops/platform
    tag: ""                    # defaults to .Chart.AppVersion
  dashboard:
    repository: sentinelops/dashboard
    tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Pre-created Secret (never generated by the chart). Keys:
#   database-url        postgresql+asyncpg://user:pass@host:5432/db   (required)
#   jwt-secret          >= 32 chars                                   (required)
#   ingest-token        >= 16 chars, shared with Alertmanager          (required)
#   anthropic-api-key   only when investigator.llmProvider=claude      (optional)
existingSecret: sentinelops

config:
  environment: production        # DEPLOYMENT_ENVIRONMENT, part of the correlation key
  kafkaBootstrap: redpanda:9092
  otlpEndpoint: http://otel-collector:4318
  prometheusUrl: http://prometheus:9090
  lokiUrl: http://loki:3100
  tempoUrl: http://tempo:3200
  alertmanagerUrl: http://alertmanager:9093
  grafanaPublicUrl: ""
  logLevel: INFO
  # disabled | recommend_only | sandbox. Even "sandbox" only ever runs allowlisted
  # runbooks after a second human approves; there is no autonomous mode.
  remediationMode: recommend_only
  approvalTtlMinutes: 15
  reopenWindowMinutes: 30
  # rules (deterministic, free) | claude (needs anthropic-api-key in the Secret)
  llmProvider: rules
  llmModel: claude-opus-5
  investigationDeadlineSeconds: 120
  # Demo-only username login. Keep false outside a sandbox.
  authDevLogin: false
  corsOrigins: ""

# What remediation may touch. Drives both the namespaced Roles (reader/executor) and the
# allowlist every service enforces (SENTINEL_* env). Runbook types are fixed in code:
# restart, rollback, scale (1..scaleMax), disable a FEATURE_* env flag.
# The namespace must already exist; nothing is cluster-scoped.
policy:
  namespace: sentinelops-demo
  deployments: [checkout, inventory, payment, worker]
  featureFlags: [FEATURE_NEW_STOCK_INDEX, FEATURE_PAYMENT_RETRY_STORM]
  scaleMax: 4

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

defaultResources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }

# Python services. `http: true` adds a Service and /healthz probes. `kube` selects
# the ServiceAccount: "" (no API token), reader, or executor.
components:
  api:
    enabled: true
    replicas: 2
    http: true
    kube: ""
    command: [uvicorn, --factory, sentinel_api.app:build, --host, 0.0.0.0, --port, "8000", --no-access-log]
    secrets: [jwt-secret]
    resources: {}
  ingestion:
    enabled: true
    replicas: 2
    http: true
    kube: ""
    command: [uvicorn, --factory, sentinel_ingestion.app:build, --host, 0.0.0.0, --port, "8000", --no-access-log]
    secrets: [ingest-token]
    resources: {}
  relay:
    enabled: true
    replicas: 1
    kube: ""
    command: [sentinel-relay]
    resources: {}
  correlator:
    enabled: true
    replicas: 1
    kube: ""
    command: [sentinel-correlator]
    resources: {}
  investigator:
    enabled: true
    replicas: 1
    kube: reader
    command: [sentinel-investigator]
    resources:
      limits: { memory: 512Mi }
  executor:
    enabled: true
    replicas: 1
    kube: executor
    command: [sentinel-executor]
    resources: {}
  verifier:
    enabled: true
    replicas: 1
    kube: reader
    command: [sentinel-verifier]
    resources: {}

migrations:
  enabled: true                # pre-install/pre-upgrade Job: alembic upgrade head
  backoffLimit: 3

dashboard:
  enabled: true
  replicas: 2
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

# HTTP services only. Pipeline workers scale with Kafka partitions, not CPU.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: ""
  host: sentinelops.example.com
  tlsSecretName: ""
  annotations: {}

networkPolicy:
  enabled: true
  # Who may reach the dashboard / API (ingress controller). Empty = any pod in the cluster.
  frontendFrom: []
  # Who may POST alerts to ingestion (Alertmanager). Empty = any pod in the cluster.
  ingestionFrom: []
  egress:
    # Off by default: Postgres/Kafka/LLM endpoints differ per environment. When on,
    # DNS is allowed and everything else must be listed in `to`.
    enabled: false
    to: []
