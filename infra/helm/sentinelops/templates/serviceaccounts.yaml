{{- $fullname := include "sentinelops.fullname" . }}
# Default identity: no Kubernetes API token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  labels: {{- include "sentinelops.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- range $role := list "reader" "executor" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-{{ $role }}
  labels: {{- include "sentinelops.labels" $ | nindent 4 }}
automountServiceAccountToken: false   # mounted explicitly only on pods that use it
{{- end }}
