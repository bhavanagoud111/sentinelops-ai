{{- /*
Least privilege, namespaced only (mirrors infra/kind/rbac.yaml):
  reader    get/list/watch deployments, replicasets, pods, events
  executor  get/list/watch/PATCH deployments; get/list replicasets, pods
No create/delete, no exec, no secrets, no cluster-scoped access.
*/ -}}
{{- $fullname := include "sentinelops.fullname" . }}
{{- with $ns := .Values.policy.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-reader
  namespace: {{ $ns }}
  labels: {{- include "sentinelops.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-executor
  namespace: {{ $ns }}
  labels: {{- include "sentinelops.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
{{- range $role := list "reader" "executor" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-{{ $role }}
  namespace: {{ $ns }}
  labels: {{- include "sentinelops.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $fullname }}-{{ $role }} }
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-{{ $role }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
