{{- if .Values.migrations.enabled }}
# Runs before install/upgrade so new code never meets an old schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentinelops.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "sentinelops.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "sentinelops.platformImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, sentinel_storage.migrate, upgrade]
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env: {{- include "sentinelops.commonEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.defaultResources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
{{- end }}
