{{- if .Values.autoscaling.enabled }}
{{- $fullname := include "sentinelops.fullname" . }}
{{- range $name, $c := .Values.components }}
{{- if and $c.enabled $c.http }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-{{ $name }}
  labels: {{- include "sentinelops.labels" $ | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $fullname }}-{{ $name }} }
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
{{- end }}
