[project]
name = "demo-worker"
version = "0.1.0"
description = "Demo background worker (sandbox workload for SentinelOps)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sentinel-common",
    "demo-faultkit",
]

[tool.uv.sources]
sentinel-common = { workspace = true }
demo-faultkit = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_worker"]
