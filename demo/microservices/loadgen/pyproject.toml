[project]
name = "demo-loadgen"
version = "0.1.0"
description = "Steady synthetic traffic for the SentinelOps demo services"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28", "pydantic-settings>=2.7"]

[project.scripts]
demo-loadgen = "demo_loadgen.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_loadgen"]
