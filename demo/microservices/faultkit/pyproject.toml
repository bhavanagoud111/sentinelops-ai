[project]
name = "demo-faultkit"
version = "0.1.0"
description = "Demo-only fault injection toggles for SentinelOps sandbox workloads"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "pydantic>=2.10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_faultkit"]
