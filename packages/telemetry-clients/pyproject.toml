[project]
name = "sentinel-telemetry"
version = "0.1.0"
description = "Read-only, bounded clients for Prometheus, Loki, Tempo and Kubernetes"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28", "pydantic-settings>=2.7", "kubernetes>=31.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_telemetry"]
