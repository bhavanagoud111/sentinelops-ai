[project]
name = "sentinel-faultinjector"
version = "0.1.0"
description = "Demo-only fault injector for the sandbox namespace (chaos ServiceAccount)"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "kubernetes>=31.0", "sentinel-common"]

[tool.uv.sources]
sentinel-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_faultinjector"]
