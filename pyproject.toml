[project]
name = "sentinelops-ai"
version = "0.1.0"
description = "AI-assisted SRE platform: incident detection, evidence-backed diagnosis, human-approved remediation"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "sentinel-contracts",
    "sentinel-common",
    "demo-faultkit",
    "demo-checkout",
    "demo-inventory",
    "demo-loadgen",
    "demo-payment",
    "demo-worker",
    "sentinel-storage",
    "sentinel-messaging",
    "sentinel-ingestion",
    "sentinel-relay",
    "sentinel-correlator",
    "sentinel-api",
    "sentinel-platform",
    "sentinel-policy",
    "sentinel-telemetry",
    "sentinel-investigator",
    "sentinel-executor",
    "sentinel-verifier",
    "sentinel-faultinjector",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/common",
    "demo/microservices/faultkit",
    "demo/microservices/checkout",
    "demo/microservices/inventory",
    "demo/microservices/loadgen",
    "demo/microservices/payment",
    "demo/microservices/worker",
    "packages/storage",
    "packages/messaging",
    "services/ingestion",
    "services/relay",
    "services/correlator",
    "apps/api",
    "services/platform",
    "packages/policy",
    "packages/telemetry-clients",
    "services/investigator",
    "services/executor",
    "services/verifier",
    "services/faultinjector",
]

[tool.uv.sources]
sentinel-contracts = { workspace = true }
sentinel-common = { workspace = true }
demo-faultkit = { workspace = true }
demo-checkout = { workspace = true }
demo-inventory = { workspace = true }
demo-loadgen = { workspace = true }
demo-payment = { workspace = true }
demo-worker = { workspace = true }
sentinel-storage = { workspace = true }
sentinel-messaging = { workspace = true }
sentinel-ingestion = { workspace = true }
sentinel-relay = { workspace = true }
sentinel-correlator = { workspace = true }
sentinel-api = { workspace = true }
sentinel-platform = { workspace = true }
sentinel-policy = { workspace = true }
sentinel-telemetry = { workspace = true }
sentinel-investigator = { workspace = true }
sentinel-executor = { workspace = true }
sentinel-verifier = { workspace = true }
sentinel-faultinjector = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]
"scripts/**" = ["S101", "S603", "S311", "E501", "RUF001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.cache/", "^\\.venv/"]
mypy_path = [
    "packages/contracts/src",
    "packages/common/src",
    "demo/microservices/faultkit/src",
    "demo/microservices/checkout/src",
    "demo/microservices/inventory/src",
    "demo/microservices/loadgen/src",
    "demo/microservices/payment/src",
    "demo/microservices/worker/src",
    "packages/storage/src",
    "packages/messaging/src",
    "services/ingestion/src",
    "services/relay/src",
    "services/correlator/src",
    "apps/api/src",
    "packages/policy/src",
    "packages/telemetry-clients/src",
    "services/investigator/src",
    "services/executor/src",
    "services/verifier/src",
    "services/faultinjector/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "aiokafka.*", "asyncpg.*", "kubernetes.*", "langgraph.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires the local Docker Compose stack (`make up`)",
]
addopts = "-ra --strict-markers -m 'not integration'"
filterwarnings = [
    # Starlette >=1.x prefers httpx2 for TestClient; harmless until we migrate.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
