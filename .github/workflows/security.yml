name: security

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI, pinned and checksum-verified, scanning the full history on every
      # run (the GitHub Action derives a commit range from the push event, which breaks on a
      # repository's first push and after history rewrites).
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}$" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
      - name: pip-audit on locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-workspace > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --strict
