name: release

# Tag vX.Y.Z → checks → images (SBOM + provenance) to GHCR → vulnerability scan →
# Helm chart packaged with the same version → GitHub release. Deploys nothing.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.10.4"
  UV_PYTHON_PREFERENCE: only-managed
  REGISTRY: ghcr.io/${{ github.repository_owner }}/sentinelops

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12 && uv sync --frozen
      - run: make check
      - run: make helm-check

  images:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
    strategy:
      matrix:
        include:
          - name: platform
            dockerfile: infra/docker/python-service.Dockerfile
            build-args: PACKAGE=sentinel-platform
          - name: dashboard
            dockerfile: infra/docker/dashboard.Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}
      - name: vulnerability scan (fails on fixable HIGH/CRITICAL)
        run: >
          docker run --rm aquasec/trivy:0.58.1 image --exit-code 1 --ignore-unfixed
          --severity HIGH,CRITICAL
          ${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}

  chart:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - run: make tools
      - name: package chart pinned to this release's images
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s|repository: sentinelops/|repository: ${REGISTRY}/|" infra/helm/sentinelops/values.yaml
          .cache/bin/helm package infra/helm/sentinelops --version "$v" --app-version "$GITHUB_REF_NAME" -d dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --verify-tag
